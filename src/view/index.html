<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajo el Membrillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-custom shadow-sm">
    <div class="container-fluid px-lg-5"> 
        <div class="row w-100 align-items-center g-0">
            <div class="col-auto d-flex align-items-center">
                <a class="navbar-brand me-4" href="index.html">Bajo el Membrillo</a>
                
            </div>
            <div class="col px-md-4">
                <div class="search-group position-relative">

    <i class="bi bi-search"></i>

    <input
        id="buscador-global"
        type="text"
        class="form-control"
        placeholder="Buscar..."
        autocomplete="off"
    >

   <div
    id="resultados-busqueda"
    class="search-results"
    ></div>

</div>
            </div>
            <div class="col-auto d-flex align-items-center gap-4">
                <div class="dropdown" id="menu-usuario">
                    <a href="#" class="nav-link-custom dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span id="texto-usuario">Usuario</span>
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
                    </ul>
                </div>
                <a href="iniciar_sesion.html" id="btn-login" class="nav-link-custom">
                    <i class="bi bi-person-circle"></i>
                    <span>Iniciar sesión</span>
                </a>
                <a href="carrito.html" class="nav-link-custom position-relative">
                    <i class="bi bi-bag"></i>
                    <span id="contador-carrito" class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-dark cart-badge">0</span>
                </a>
                <button
                id="btn-tema"
                class="btn btn-outline-secondary btn-sm">
                🌙
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid px-lg-5 mt-4">
    <section class="section-container mb-5">
        <h2 class="section-title titulo-libros">Los 10 libros más vendidos</h2>
        <div id="contenedor-libros" class="carousel-netflix"></div>
        <div class="text-end mt-2">
            <a href="libros.html" class="btn-ver-mas btn-libros">Ver más libros <i class="bi bi-arrow-right-short"></i></a>
        </div>
    </section>
    <section class="section-container mb-5">
        <h2 class="section-title titulo-musica">Los 10 álbumes de música más vendidos</h2>
        <div id="contenedor-musica" class="carousel-netflix"></div>
        <div class="text-end mt-2">
            <a href="musica.html" class="btn-ver-mas btn-musica">Ver más música <i class="bi bi-arrow-right-short"></i></a>
        </div>
    </section>
    <section class="section-container mb-5">
        <h2 class="section-title titulo-objetos">Los 10 objetos más vendidos</h2>
        <div id="contenedor-objetos" class="carousel-netflix"></div>
        <div class="text-end mt-2">
            <a href="objetos.html" class="btn-ver-mas btn-objetos">Ver más objetos <i class="bi bi-arrow-right-short"></i></a>
        </div>
    </section>
</main>

<script src="../viewModel/carrito_utils.js"></script>
<script src="../viewModel/auth.js"></script>
<script src="../viewModel/main.js"></script>
<script src="../viewModel/busqueda_global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../viewModel/tema.js"></script>
</body>
</html>
