<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | Bajo el Membrillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold">Tu Carrito</h2>
        <div class="row">
            <div class="col-lg-8">
                <div id="contenedor-carrito" class="row g-4"></div>
            </div>
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <h5 class="fw-bold mb-3">Resumen del pedido</h5>
                    <div class="d-flex justify-content-between">
                        <p>Total:</p>
                        <h4 id="total-carrito" class="fw-bold">$0</h4>
                    </div>
                    <button class="btn btn-dark w-100 mt-3 rounded-3">Finalizar compra</button>
                    <a href="index.html" class="btn btn-link w-100 mt-2 text-muted">Seguir comprando</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../viewModel/carrito.js"></script>
</body>
</html>
