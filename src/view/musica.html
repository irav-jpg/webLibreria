<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajo el Membrillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Enlace a tu CSS externo -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-custom shadow-sm">
        <div class="container-fluid px-lg-5">
            <div class="row w-100 align-items-center g-0">
                
                <!-- LOGO -->
                <div class="col-auto d-flex align-items-center">
                    <a class="navbar-brand me-4" href="index.html">
                        Bajo el Membrillo
                    </a>
                </div>

                <!-- BUSCADOR -->
                <div class="col px-md-4">
                    <div class="search-group">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control" placeholder="Buscar...">
                    </div>
                </div>

                <!-- ICONOS -->
                <div class="col-auto d-flex align-items-center gap-4">
                    <a href="#" class="nav-link-custom d-none d-sm-flex">
                        <i class="bi bi-person-circle"></i>
                        <span>Iniciar sesión</span>
                    </a>
                    <a href="#" class="nav-link-custom position-relative">
                        <i class="bi bi-bag"></i>
                        <span class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-dark cart-badge">
                            0
                        </span>
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container-fluid mt-4">
        <div class="row">

            <!-- SIDEBAR FILTROS (ESCRITORIO) -->
            <aside class="col-lg-3 filtros-sidebar">
                <h4 class="mb-4">Filtros</h4>
                
                <!-- Buscador -->
                <div class="mb-4">
                    <input type="text" id="buscador-albumes" class="form-control" placeholder="Buscar álbum por título...">
                </div>
                
                <!-- Género -->
                <div class="mb-4">
                    <label for="filtro-genero" class="form-label h6">Género</label>
                    <select id="filtro-genero" class="form-select">
                        <option value="">Todos</option>
                        <option value="Pop">Pop</option>
                        <option value="Pop Latino">Pop Latino</option>
                        <option value="Rock/Alternativo">Rock/Alternativo</option>
                        <option value="K-pop">K-pop</option>
                        <option value="R&B/Dance">R&B/Dance</option>
                    </select>
                </div>

                <!-- Precio -->
                <!-- Año -->
                <div class="mb-4">

                    <label for="filtro-anio"
                        class="form-label h6">

                        Año 

                    </label>

                    <input
                        type="range"
                        id="filtro-anio"
                        min="1970"
                        max="2025"
                        value="2025"
                        class="form-range"
                    >

                    <p class="mt-2">

                        Hasta
                        <span id="anio-valor">
                             2025
                        </span>

                    </p>

                </div>

                <!-- Precio -->
                <div class="mb-4">
                    <label for="filtro-precio" class="form-label h6">Precio máximo</label>
                    <input type="range" id="filtro-precio" min="100" max="600" value="600" class="form-range">
                    <p class="mt-2">$<span id="precio-valor">600</span></p>
                </div>
            </aside>

            <!-- SECCIÓN CENTRAL / CONTENIDO -->
            <section class="col-lg-9">
                
                <!-- FILTROS DESPLEGABLES (MÓVIL) -->
                <div class="d-lg-none mb-4">
                    <button class="btn w-100 btn-filtros-mobile" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosMobile">
                        <i class="bi bi-sliders"></i> Filtrar álbumes
                    </button>

                    <div class="collapse mt-3" id="filtrosMobile">
                        <div class="card card-body">
                            
                            <!-- Género Móvil -->
                            <div class="mb-3">
                                <label for="filtro-genero-mobile" class="form-label h6">Género</label>
                                <select id="filtro-genero-mobile" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="Pop">Pop</option>
                                    <option value="Pop Latino">Pop Latino</option>
                                    <option value="Rock/Alternativo">Rock/Alternativo</option>
                                    <option value="K-pop">K-pop</option>
                                    <option value="R&B/Dance">R&B/Dance</option>
                                </select>
                            </div>

                            <!-- Año Móvil -->
                            <div class="mb-3">
                                <label for="filtro-anio-mobile" class="form-label h6">Año</label>
                                <input type="range" id="filtro-anio-mobile" min="1970" max="2025" value="2025" class="form-range">
                                <p class="mt-2">Hasta <span id="anio-valor-mobile">2025</span></p>
                            </div>

                            <!-- Precio Móvil -->
                            <div>
                                <label for="filtro-precio-mobile" class="form-label h6">Precio máximo</label>
                                <input type="range" id="filtro-precio-mobile" min="100" max="600" value="600" class="form-range">
                                <p class="mt-2">$<span id="precio-valor-mobile">600</span></p>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- GRILLA DE PRODUCTOS -->
                <h2 class="mb-4 titulo-albumes">Todos los álbumes</h2>
                <div id="contenedor-albumes-grid" class="productos-grid">
                    <!-- Los álbumes se cargarán dinámicamente aquí -->
                </div>

            </section>

        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="../viewModel/musica.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
