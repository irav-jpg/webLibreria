<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajo el Membrillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-custom shadow-sm">
        <div class="container-fluid px-lg-5">
            <div class="row w-100 align-items-center g-0">
                <div class="col-auto d-flex align-items-center">
                    <a class="navbar-brand me-4" href="index.html">
                        Bajo el Membrillo
                    </a>
                </div>
                <div class="col px-md-4">
                    <div class="search-group position-relative">
                        <i class="bi bi-search"></i>
                        <input type="text" id="buscador-global" class="form-control" placeholder="Buscar..." autocomplete="off">
                        <div id="resultados-busqueda" class="search-results"></div>
                    </div>
                </div>
                <div class="col-auto d-flex align-items-center gap-4">
                    <div class="dropdown d-none" id="menu-usuario">
                        <a href="#" class="nav-link-custom dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                            <span id="texto-usuario">Usuario</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
                        </ul>
                    </div>
                    
                    <a href="iniciar_sesion.html" id="btn-login" class="nav-link-custom">
                        <i class="bi bi-person-circle"></i>
                        <span>Iniciar sesión</span>
                    </a>

                    <a href="carrito.html" class="nav-link-custom position-relative">
                        <i class="bi bi-bag"></i>
                        <span class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-dark cart-badge">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid mt-4">
        <div class="row">
            <aside class="col-lg-3 filtros-sidebar">
                <h4 class="mb-4">Filtros</h4>
                <div class="mb-4">
                    <input type="text" id="buscador-libros" class="form-control" placeholder="Buscar libro por título...">
                </div>
                <div class="mb-4">
                    <h6>Categoría</h6>
                    <select id="filtro-categoria" class="form-select">
                        <option value="">Todas</option>
                        <option value="Fantasia">Fantasía</option>
                        <option value="Suspenso">Suspenso</option>
                        <option value="Romance">Romance</option>
                        <option value="Terror">Terror</option>
                        <option value="Drama">Drama</option>
                    </select>
                </div>
                <div class="mb-4">
                    <h6>Editorial</h6>
                    <select id="filtro-editorial" class="form-select">
                        <option value="">Todas</option>
                        <option value="Salamandra">Salamandra</option>
                        <option value="Planeta">Planeta</option>
                        <option value="Minotauro">Minotauro</option>
                        <option value="Penguin Classics">Penguin Classics</option>
                        <option value="Debolsillo">Debolsillo</option>
                        <option value="Alfaguara">Alfaguara</option> 
                        <option value="Alianza">Alianza</option>      
                        <option value="Alma">Alma</option>
                        <option value="Austral">Austral</option>
                        <option value="Debolsillo">Debolsillo</option>        
                    </select>
                </div>
                <div class="mb-4">
                    <h6>Idioma</h6>
                    <select id="filtro-idioma" class="form-select">
                        <option value="">Todos</option>
                        <option value="Español">Español</option>
                        <option value="Inglés">Inglés</option>
                    </select>
                </div>
                <div class="mb-4">
                    <h6>Precio máximo</h6>
                    <input type="range" id="filtro-precio" min="200" max="600" value="600" class="form-range">
                    <p>$<span id="precio-valor">600</span></p>
                </div>
            </aside>

            <div class="d-lg-none mb-4">
                <button class="btn w-100 btn-filtros-mobile" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosMobile">
                    <i class="bi bi-sliders"></i>
                    Filtrar libros
                </button>
                <div class="collapse mt-3" id="filtrosMobile">
                    <div class="card card-body">
                        <div class="mb-3">
                            <h6>Categoría</h6>
                            <select id="filtro-categoria-mobile" class="form-select">
                                <option value="">Todas</option>
                                <option value="Fantasia">Fantasía</option>
                                <option value="Suspenso">Suspenso</option>
                                <option value="Romance">Romance</option>
                                <option value="Terror">Terror</option>
                                <option value="Drama">Drama</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <h6>Editorial</h6>
                            <select id="filtro-editorial-mobile" class="form-select">
                                <option value="">Todas</option>
                                <option value="Salamandra">Salamandra</option>
                                <option value="Planeta">Planeta</option>
                                <option value="Minotauro">Minotauro</option>
                                <option value="Debolsillo">Debolsillo</option>
                                <option value="Penguin Classics">Penguin Classics</option>
                                <option value="Alfaguara">Alfaguara</option>
                                <option value="Austral">Austral</option>
                                <option value="Nocturna">Nocturna</option>
                                <option value="Molino">Molino</option>
                                <option value="Destino">Destino</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <h6>Idioma</h6>
                            <select id="filtro-idioma-mobile" class="form-select">
                                <option value="">Todos</option>
                                <option value="Español">Español</option>
                                <option value="Inglés">Inglés</option>
                            </select>
                        </div>
                        <div>
                            <h6>Precio máximo</h6>
                            <input type="range" id="filtro-precio-mobile" min="200" max="600" value="600" class="form-range">
                            <p class="mt-2">$<span id="precio-valor-mobile">600</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <section class="col-lg-9">
                <h2 class="mb-4 titulo-libros">Todos los libros</h2>
                <div id="contenedor-libros-grid" class="productos-grid"></div>
            </section>
        </div>
    </main>
    
    <script src="../viewModel/auth.js"></script>
    <script src="../viewModel/carrito_utils.js"></script>
    <script src="../viewModel/busqueda_global.js"></script>
    <script src="../viewModel/libros.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../viewModel/tema.js"></script>
</body>
</html>
